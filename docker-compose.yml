# SQL Server para el proveedor SqlServer (desarrollo).
# Uso: cp .env.example .env && docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Imagen solo amd64: en Apple Silicon corre con Rosetta (Docker Desktop).
    platform: linux/amd64
    container_name: sb-nomina-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      # Solo accesible desde este equipo.
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-datos:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-datos:
